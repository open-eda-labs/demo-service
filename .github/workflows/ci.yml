name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    # Convenção da org: o lint mora no repositório .github.
    uses: open-eda-labs/.github/.github/workflows/lint.yml@main

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      # Pendência: pinar por SHA de commit (D-40).
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      # Irmãos na branch de mesmo nome do PR (mudança encadeada entre repositórios), senão na main.
      - name: Clonar demo-parent e demo-lib
        env:
          B: ${{ github.head_ref || github.ref_name }}
        run: |
          git clone -q --depth 1 --branch "$B" https://github.com/open-eda-labs/demo-parent demo-parent \
            || git clone -q --depth 1 https://github.com/open-eda-labs/demo-parent demo-parent
          git clone -q --depth 1 --branch "$B" https://github.com/open-eda-labs/demo-lib demo-lib \
            || git clone -q --depth 1 https://github.com/open-eda-labs/demo-lib demo-lib
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Dois servidores (github e github-demo-lib) com o mesmo token: o setup-java configura só um server-id.
      - name: settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-demo-lib</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML
      # O PR não depende de ler o GitHub Packages: parent e lib da main vão para o ~/.m2 do runner.
      - run: mvn -B -ntp -q install
        working-directory: demo-parent
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mvn -B -ntp -q install
        working-directory: demo-lib
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mvn -B -ntp verify
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sbom
          path: target/bom.json
