# Cenários de falha (dados sintéticos). kind = classe de labs.demo.chaos que injeta a falha.
name: latencia-200ms
kind: LatencyFault
millis: 200
status: 200
message: "latência injetada de ${millis} ms no cenário ${name}"
---
name: erro-500
kind: ErrorFault
status: 500
message: "falha injetada no cenário ${name} com status ${status}"
---
name: erro-503
kind: ErrorFault
status: 503
message: "dependência indisponível simulada no cenário ${name}"
---
name: oom-1mb
kind: OomFault
bytes: 1048576
status: 200
message: "buffer de ${bytes} bytes alocado e liberado no cenário ${name}"
---
name: oom-acima-do-limite
kind: OomFault
bytes: 33554432
status: 200
message: "memória esgotada (simulado) no cenário ${name}: status ${status}"
